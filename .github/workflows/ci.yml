name: ci

# On every push and pull request: the whole suite on Fedora, both Debian releases and Ubuntu 24.04,
# on both architectures; the packages built, their file lists checked and a consumer outside the tree built
# against each; omx-contract installed from the FreeMixer channel at the floor the packaging
# declares, and refused below its floor; and the release workflow as a dry run. Nothing is signed or published here. Every job reads this
# repository and other public ones, and runs on GitHub's runners.

on:
  pull_request:
  push:
    branches: [main, dedupe/all]

permissions:
  contents: read

env:
  # omx-contract's reader, render and install script, which data/ is read back through and the definitions header
  # rendered by, from this release tag: the floor packaging/deps.txt declares
  OMX_CONTRACT_REF: v3.9.0

jobs:
  test:
    name: make test (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    # Run one make job per CPU (BUILDING.md: make -jN test is supported, and make gen-once holds the
    # one generation under -j8): serially the suite reached 39 to 43 minutes of this 60-minute limit
    # once the remaining-FX wave's oracles and perturbation scripts joined it, and one trixie run went
    # past it. Every check still runs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ubuntu:24.04 carries GCC 13, whose -Wmaybe-uninitialized reads paths the newer
        # compilers prove dead.
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie', 'ubuntu:24.04']
        arch: [amd64]  # arm64 builds run at release only (release.yml)
    container:
      image: ${{ matrix.image }}
    # debian images run sh by default, which has no pipefail
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False gcc make binutils gawk diffutils git curl tar gzip dnf5-plugins pkgconf-pkg-config
          else
            apt-get update -qq
            apt-get install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
          fi

      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The build dependencies, omx-contract among them, from what the packaging declares: no version
      # is named here.
      # the channel serves Debian; an Ubuntu takes its trixie index (omx-contract is Architecture: all)
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
        with:
          suite: ${{ startsWith(matrix.image, 'ubuntu') && 'trixie' || '' }}

      - name: Install the build dependencies from the OpenMixer channel
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf builddep -y --setopt=install_weak_deps=False packaging/omx-dsp.spec
          else
            apt-get build-dep -y --no-install-recommends ./
          fi
          pkg-config --modversion omx-contract
          sh tools/contract-include.sh

      - name: The version agrees everywhere it is written
        id: handback-version
        run: |
          set -euo pipefail
          v=$(make -s version)
          grep -q "^Version: $v\$" packaging/omx-dsp.spec
          head -1 debian/changelog | grep -q "^omx-dsp ($v) "
          # the test containers carry no node: the twins' version is read as text
          grep -q "^  \"version\": \"$v\",\$" ts/package.json

      - name: Every file a comment can be written in opens with its licence
        id: handback-spdx
        uses: FreeMixer/.github/.github/actions/spdx-check@v1

      # packaging/deps.txt is the one place a floor is written: the spec, debian/control and OMX_CONTRACT_REF follow it
      - name: The dependency floors are the ones packaging/deps.txt declares
        id: handback-deps
        uses: FreeMixer/.github/.github/actions/deps-render@v1

      - name: The release workflow builds arm on every tag
        id: handback-release-arm-gate
        run: tools/release-arm-gate-selftest.sh && tools/release-arm-gate-selftest.sh --sabotage

      - name: make test
        id: handback-test
        run: make -j"$(nproc)" test

  # The sabotage of the range: omx-contract 2.6.0, which the channel still serves and which is below
  # the floor the spec declares, must stop the build at once with a message that names the
  # dependency, the floor and the version installed.
  # The TypeScript twins against the kernels (ts/: npm test), on the library this tree builds; the publish workflow runs
  # the same before it publishes, so a twin that disagrees is red here first.
  twins:
    name: The TypeScript twins agree with the kernels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential gawk diffutils git ca-certificates curl pkgconf dpkg-dev
      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: Install the build dependencies from the OpenMixer channel
        run: apt-get build-dep -y --no-install-recommends ./
      - name: The library the twins are checked against
        run: make -j"$(nproc)" lib
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test
        working-directory: ts
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee /tmp/ts-test.log
          grep -q 'linked against the tree' /tmp/ts-test.log

  contract-floor:
    name: below the omx-contract floor the build refuses (${{ matrix.image }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm']
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      OLD: 2.6.0
    steps:
      - name: Install the build tools
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False git gcc make gawk dnf5-plugins pkgconf-pkg-config
          else
            apt-get update -qq
            apt-get install -y --no-install-recommends git ca-certificates curl build-essential gawk pkgconf
          fi

      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Install omx-contract ${{ env.OLD }}
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf install -y "omx-contract-devel-$OLD"
          else
            apt-get install -y --no-install-recommends "libomx-contract-dev=$OLD"
          fi
          test "$(pkg-config --modversion omx-contract)" = "$OLD"

      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: make lib fails, naming omx-contract, the floor and ${{ env.OLD }}
        run: |
          set +e -uo pipefail
          floor="$(sh tools/contract-include.sh --floor)"
          make lib > out.txt 2>&1; rc=$?
          cat out.txt
          [ "$rc" != 0 ] || { echo "make lib built against omx-contract $OLD, below the floor $floor"; exit 1; }
          ! ls build/*.o >/dev/null 2>&1 || { echo "make compiled before refusing"; exit 1; }
          for word in omx-contract "$floor" "$OLD"; do
            grep -q "contract-include:.*$word" out.txt || { echo "the refusal does not name '$word'"; exit 1; }
          done
          echo "refused as it must be: $(grep -m1 'contract-include:' out.txt)"

  # data/ read back through omx-contract's reader (make contract-dir) and the committed definitions header held
  # equal to its render (make definitions-check), and the round-trip and completeness proofs over data/ and recipes/answers/
  # (make contract-proof). They need node and an omx-contract checkout, which no other job has.
  contract:
    name: data/ read back through omx-contract's reader, the committed header its render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # the proofs read this library's own history: v0.1.3's header, 4108494's reads, e2a13a0's removed aliases
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch omx-contract at OMX_CONTRACT_REF and install it
        run: |
          set -euo pipefail
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/FreeMixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          npm ci --prefix /tmp/omx-contract --omit=dev
          # the Makefile finds omx-contract by pkg-config: the checkout itself, installed under a scratch prefix
          make -C /tmp/omx-contract install PREFIX=/tmp/omx-contract-prefix
          echo "PKG_CONFIG_PATH=/tmp/omx-contract-prefix/share/pkgconfig" >> "$GITHUB_ENV"

      - name: make definitions-check
        run: make definitions-check OMX_CONTRACT=/tmp/omx-contract

      - name: make contract-dir
        run: make contract-dir OMX_CONTRACT=/tmp/omx-contract

      - name: make eq-defaults-table
        run: make eq-defaults-table

      - name: make contract-proof
        run: make contract-proof OMX_CONTRACT=/tmp/omx-contract

      - name: make contract-tests
        run: make contract-tests OMX_CONTRACT=/tmp/omx-contract

  # The libFuzzer harnesses of fuzz/ (clang, libFuzzer, ASan, UBSan, the library's contracts), each run for 60 s from
  # its seed corpus; red on any crash or broken contract, the crashing input uploaded. omx-contract's header is
  # read from a checkout at OMX_CONTRACT_REF through OMX_CONTRACT_INC (no node and no install needed to fuzz).
  fuzz:
    name: fuzz (60 s per harness)
    runs-on: ubuntu-latest
    # a backstop: six harnesses of 60 s and their build end well inside this
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and libFuzzer's runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev

      - name: Fetch omx-contract at OMX_CONTRACT_REF
        run: |
          set -euo pipefail
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/FreeMixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          echo "OMX_CONTRACT_INC=/tmp/omx-contract/include" >> "$GITHUB_ENV"

      - name: Build the harnesses (clang, libFuzzer, ASan, UBSan, contracts)
        run: make fuzz

      - name: Fuzz each harness for 60 s
        id: handback-fuzz
        run: make fuzz-run FUZZ_TIME=60

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore

  docs:
    name: make docs (the public headers are fully documented)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: make docs
        run: make docs

  rpm:
    name: omx-dsp-devel (fc44, ${{ matrix.arch }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    # %check runs make check-package, as the deb job's build does
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]  # aarch64 builds run at release only (release.yml)
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils pkgconf-pkg-config python3

      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file list
        run: |
          set -euo pipefail
          rpm=$(ls rpms/omx-dsp-devel-[0-9]*.${{ matrix.arch }}.rpm)
          rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v '^d' | cut -d' ' -f2 \
            | sed 's,/usr/lib64/,/usr/lib*/,' | grep -v '^/usr/include/omxdsp/' | sort > files.txt
          printf '%s\n' '/usr/lib*/libomxdsp.a' '/usr/lib*/libomxdsp-contracts.a' '/usr/lib*/libomxdsp-tsan.a' \
            '/usr/lib*/pkgconfig/omxdsp.pc' '/usr/lib*/pkgconfig/omxdsp-contracts.pc' '/usr/lib*/pkgconfig/omxdsp-tsan.pc' \
            /usr/share/doc/omx-dsp-devel/README.md \
            /usr/share/licenses/omx-dsp-devel/LICENSE /usr/bin/omx-dsp-copy-check \
            /usr/share/man/man1/omx-dsp-copy-check.1.gz \
            /usr/share/omxdsp/omx-dsp-exports.json /usr/share/omxdsp/hrp_peaking_corpus.h \
            /usr/share/omxdsp/meter-view-vectors.json | sort > expected.txt
          diff -u expected.txt files.txt
          # the listing is read from a file: grep -q stops at its first match, and under pipefail the rpm it
          # cut off (SIGPIPE, exit 141) fails the step once the listing is longer than the pipe holds
          rpm -qlp "$rpm" > listing.txt
          grep -q '^/usr/include/omxdsp/fx/omx_delay.h$' listing.txt
          grep -q '^/usr/include/omxdsp/fx/omx_reverb.h$' listing.txt
          # the gate is its own package: its binary, man page and share directory, and nothing of it in the devel one
          ! grep -q 'rt-gate' listing.txt
          rpm -qlp "$(ls rpms/omx-rt-gate-[0-9]*.${{ matrix.arch }}.rpm)" > listing.txt
          for f in bin/omx-rt-gate share/man/man1/omx-rt-gate.1.gz share/omxdsp/rt-gate/tables/forbidden.tbl \
                   share/omxdsp/rt-gate/tables/classes.tbl share/omxdsp/rt-gate/tables/lv2.abi share/omxdsp/rt-gate/tables/clap.abi \
                   share/omxdsp/rt-gate/tables/pipewire.abi share/omxdsp/rt-gate/tables/omxdsp.abi share/omxdsp/rt-gate/omx-dsp.tags \
                   share/omxdsp/rt-gate/graphs/omx_fbs_detect.ci; do grep -q "^/usr/$f\$" listing.txt; done
          ! grep -E '\.so(\.|$)' listing.txt
          # the contract directory is read at run time: it is omx-dsp-contract's, never the devel package's (omx-contract#150)
          ! grep -q '^/usr/share/omx-contract/' listing.txt
          rpm -qpR "$rpm" | grep -q '^omx-dsp-contract = '
          contract=$(ls rpms/omx-dsp-contract-[0-9]*.noarch.rpm)
          rpm -qlp "$contract" > contract.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/MANIFEST.json$' contract.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/render.json$' contract.txt
          # every definition file of data/ is installed, under the same relative path
          diff <(cd data && find . -name '*.json' | sed 's|^\./|/usr/share/omx-contract/contract.d/3/omx-dsp/|' | sort) \
               <(grep '^/usr/share/omx-contract/contract.d/3/omx-dsp/.*\.json$' contract.txt | grep -v '/MANIFEST\.json$' | sort)

      - name: A consumer builds against omx-dsp-devel
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False rpms/omx-dsp-devel-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-dsp-contract-[0-9]*.noarch.rpm
          test "$(pkg-config --modversion omxdsp)" = "$(make -s version)"
          pkg-config --cflags omxdsp | grep -q -- '-ffp-contract=off'
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden test/fx/delay_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden test/golden/delay.sha256
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden-reverb test/fx/reverb_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden-reverb test/golden/reverb.sha256
          gcc $(pkg-config --cflags omxdsp-contracts) -O2 -o /tmp/flavour test/omxdsp_flavour.c $(pkg-config --libs omxdsp-contracts)
          /tmp/flavour

      - uses: actions/upload-artifact@v4
        with:
          name: omx-dsp-rpms-fc44-${{ matrix.arch }}
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: libomxdsp-dev (${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    # the package build runs make check-package (dh_auto_test), which takes under 15 minutes on a hosted
    # runner; make test, with the sabotage and perturbation arms, ran here until it no longer fit 60
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64]  # arm64 builds run at release only (release.yml)
    container:
      image: debian:${{ matrix.suite }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian gawk pkgconf python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Take omx-contract from the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      - name: A consumer builds against libomxdsp-dev
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/libomxdsp-dev_*.deb ./debs/omx-dsp-contract_*.deb ./debs/omx-rt-gate_*.deb
          dpkg -L libomxdsp-dev > listing.txt   # read from a file: see the RPM job's listing
          # the contract directory is omx-dsp-contract's (omx-contract#150)
          ! grep -q '^/usr/share/omx-contract/' listing.txt
          ! grep -E '\.so(\.|$)' listing.txt
          for a in libomxdsp libomxdsp-contracts libomxdsp-tsan; do grep -q "/$a\.a\$" listing.txt; done
          for p in omxdsp omxdsp-contracts omxdsp-tsan; do grep -q "/pkgconfig/$p\.pc\$" listing.txt; done
          # the gate is its own package (libomxdsp-dev is Multi-Arch: same, no executable belongs there)
          ! grep -q 'rt-gate' listing.txt
          dpkg -L omx-rt-gate > listing.txt
          for f in /usr/bin/omx-rt-gate /usr/share/man/man1/omx-rt-gate.1.gz /usr/share/omxdsp/rt-gate/tables/forbidden.tbl \
                   /usr/share/omxdsp/rt-gate/omx-dsp.tags /usr/share/omxdsp/rt-gate/graphs/omx_fbs_detect.ci; do grep -q "^$f\$" listing.txt; done
          dpkg -L omx-dsp-contract > listing.txt
          grep -q '^/usr/share/omx-contract/contract.d/3/omx-dsp/MANIFEST.json$' listing.txt
          diff <(cd data && find . -name '*.json' | sed 's|^\./|/usr/share/omx-contract/contract.d/3/omx-dsp/|' | sort) \
               <(grep '^/usr/share/omx-contract/contract.d/3/omx-dsp/.*\.json$' listing.txt | grep -v '/MANIFEST\.json$' | sort)
          test "$(pkg-config --modversion omxdsp)" = "$(make -s version)"
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden test/fx/delay_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden test/golden/delay.sha256
          gcc $(pkg-config --cflags omxdsp) -Itest/fx -include test/support/log10f_subst.h -O2 -o /tmp/golden-reverb test/fx/reverb_golden.test.c $(pkg-config --libs omxdsp)
          /tmp/golden-reverb test/golden/reverb.sha256
          gcc $(pkg-config --cflags omxdsp-contracts) -O2 -o /tmp/flavour test/omxdsp_flavour.c $(pkg-config --libs omxdsp-contracts)
          /tmp/flavour

  release-dry-run:
    name: release workflow, dry run
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # arm64/aarch64 build at release only

  # the checks every FreeMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (FreeMixer/.github's public-sources-check)
  public-sources:
    uses: FreeMixer/.github/.github/workflows/public-sources-check.yml@v1
